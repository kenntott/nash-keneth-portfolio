<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nash Kenneth | Full-Stack Developer</title>
    <meta name="description" content="Portfolio of Nash Kenneth — Full-Stack Developer building modern, responsive, and functional web applications, management systems, and digital solutions." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nash Kenneth | Full-Stack Developer" />
    <meta property="og:description" content="I build modern, responsive, and functional web applications, management systems, and digital solutions that turn ideas into real-world impact." />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nash Kenneth | Full-Stack Developer" />
    <meta name="twitter:description" content="I build modern, responsive, and functional web applications, management systems, and digital solutions that turn ideas into real-world impact." />

    <!-- Google Fonts: Space Grotesk, Syne, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Preload Profile Images for instant, zero-flicker theme switching -->
    <link rel="preload" as="image" href="/images/nash1.jpg" />
    <link rel="preload" as="image" href="/images/nash2.jpg" />

    <!-- Anti-flash inline theme loader -->
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('theme-mode');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && systemDark) || !storedTheme) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFD] dark:bg-[#07070B] text-[#0F172A] dark:text-[#FFFFFF] antialiased transition-colors duration-300 selection:bg-[#8B5CF6]/30 selection:text-[#C084FC]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
