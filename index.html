    <!-- Anti-flash inline theme loader -->
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('theme-mode');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && systemDark) || !storedTheme) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#08090C] text-[#111827] dark:text-[#FFFFFF] antialiased transition-colors duration-300 selection:bg-[#00E5A8]/20 selection:text-[#00E5A8]">

  </body>
