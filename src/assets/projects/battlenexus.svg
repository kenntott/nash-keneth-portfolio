<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02040b"/>
      <stop offset="60%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#141a3d"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Distant Skyscrapers & City Skyline -->
  <g opacity="0.6">
    <rect x="30" y="160" width="45" height="290" fill="#0c142b"/>
    <rect x="65" y="120" width="60" height="330" fill="#080e22"/>
    <rect x="115" y="190" width="40" height="260" fill="#111a38"/>
    <rect x="150" y="100" width="70" height="350" fill="#060b1c"/>
    <rect x="210" y="140" width="50" height="310" fill="#0f1836"/>
    <!-- Center Megatower -->
    <polygon points="370,50 430,50 450,450 350,450" fill="#080e24"/>
    <line x1="400" y1="20" x2="400" y2="50" stroke="#00f0ff" stroke-width="3" filter="url(#neonGlow)"/>
    <circle cx="400" cy="20" r="4" fill="#ff0077" filter="url(#neonGlow)"/>
    <!-- Right Skyline -->
    <rect x="540" y="130" width="55" height="320" fill="#0d1633"/>
    <rect x="585" y="90" width="75" height="360" fill="#070c1f"/>
    <rect x="650" y="170" width="45" height="280" fill="#101938"/>
    <rect x="690" y="110" width="80" height="340" fill="#060b1c"/>
  </g>

  <!-- Holographic Windows & Cyber Beacons -->
  <g opacity="0.8">
    <circle cx="95" cy="140" r="2" fill="#00ffff" filter="url(#neonGlow)"/>
    <circle cx="95" cy="160" r="2" fill="#00ffff"/>
    <circle cx="185" cy="130" r="2" fill="#d946ef"/>
    <circle cx="185" cy="150" r="2" fill="#d946ef" filter="url(#neonGlow)"/>
    <circle cx="620" cy="120" r="2.5" fill="#00ffff" filter="url(#neonGlow)"/>
    <circle cx="620" cy="150" r="2.5" fill="#ff0055"/>
    <circle cx="730" cy="140" r="2" fill="#00ffff"/>
    <!-- Holographic Billboards -->
    <rect x="160" y="180" width="45" height="25" fill="#00f0ff" opacity="0.3" filter="url(#neonGlow)"/>
    <text x="165" y="197" font-family="sans-serif" font-size="10" font-weight="900" fill="#00ffff" letter-spacing="2">NEXUS</text>
    <rect x="600" y="170" width="45" height="22" fill="#d946ef" opacity="0.3" filter="url(#neonGlow)"/>
    <text x="606" y="185" font-family="sans-serif" font-size="9" font-weight="900" fill="#ff77e9" letter-spacing="1">TOKYO</text>
  </g>

  <!-- Flying Cyber Vehicles (Traffic Trails) -->
  <path d="M 20 220 L 320 230" stroke="#00ffff" stroke-width="1.5" stroke-dasharray="18 100" opacity="0.7" filter="url(#neonGlow)"/>
  <path d="M 780 200 L 480 215" stroke="#ff0077" stroke-width="1.5" stroke-dasharray="25 120" opacity="0.7" filter="url(#neonGlow)"/>
  <path d="M 0 260 L 400 270" stroke="#facc15" stroke-width="1.2" stroke-dasharray="15 80" opacity="0.6"/>

  <!-- High-Altitude Suspended Fighting Platform Floor -->
  <polygon points="120,450 240,280 560,280 680,450" fill="#080d1e"/>
  
  <!-- Perspective Cyber Grid on Arena Floor -->
  <g stroke="url(#gridGrad)" stroke-width="1.2" opacity="0.75">
    <line x1="240" y1="280" x2="120" y2="450"/>
    <line x1="320" y1="280" x2="260" y2="450"/>
    <line x1="400" y1="280" x2="400" y2="450"/>
    <line x1="480" y1="280" x2="540" y2="450"/>
    <line x1="560" y1="280" x2="680" y2="450"/>
    <!-- Transverse Gridlines -->
    <line x1="225" y1="300" x2="575" y2="300"/>
    <line x1="205" y1="325" x2="595" y2="325"/>
    <line x1="180" y1="355" x2="620" y2="355"/>
    <line x1="150" y1="395" x2="650" y2="395"/>
    <line x1="120" y1="445" x2="680" y2="445"/>
  </g>

  <!-- Outer Neon Energy Rings -->
  <ellipse cx="400" cy="360" rx="200" ry="60" fill="none" stroke="url(#ringGrad)" stroke-width="3" filter="url(#neonGlow)"/>
  <ellipse cx="400" cy="360" rx="100" ry="30" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.8"/>
  <circle cx="400" cy="360" r="12" fill="#00ffff" opacity="0.6" filter="url(#neonGlow)"/>

  <!-- Perimeter Light Beacons -->
  <line x1="235" y1="270" x2="235" y2="290" stroke="#00ffff" stroke-width="4" filter="url(#neonGlow)"/>
  <line x1="565" y1="270" x2="565" y2="290" stroke="#d946ef" stroke-width="4" filter="url(#neonGlow)"/>
  <line x1="115" y1="420" x2="115" y2="450" stroke="#00ffff" stroke-width="5" filter="url(#neonGlow)"/>
  <line x1="685" y1="420" x2="685" y2="450" stroke="#d946ef" stroke-width="5" filter="url(#neonGlow)"/>

  <!-- Top Vignette & Corner Tech Badges -->
  <polygon points="120,450 150,450 140,430 110,430" fill="#00f0ff" opacity="0.6"/>
  <polygon points="680,450 650,450 660,430 690,430" fill="#d946ef" opacity="0.6"/>
</svg>